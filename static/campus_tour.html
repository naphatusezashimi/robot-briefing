<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D Campus Tour – วิทยาลัยเทคนิคท่าหลวงซิเมนต์ไทยอนุสรณ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1724;--panel:rgba(12,20,34,.82);--line:rgba(255,255,255,.14);--acc:#ffb020;--txt:#f4f7fb;--mut:#a9b6c8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Kanit',system-ui,sans-serif;color:var(--txt)}
  #stage{position:fixed;inset:0}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #overlay{pointer-events:none}
  .bar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
  .brand{pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:min(62vw,440px)}
  .brand b{display:block;font-weight:600;font-size:14px;line-height:1.25}
  .brand span{font-size:11px;color:var(--mut)}
  .ctrls{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:56vw}
  button{font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
  button:hover{border-color:rgba(255,255,255,.35)}
  button.primary{background:linear-gradient(135deg,#ff8a00,#ffb020);color:#1a1200;border:none;font-weight:600}
  button.rec{border-color:#ff4d4f}
  button.rec.on{background:#d7263d;border-color:#d7263d;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.7}}
  #drawer{position:fixed;top:64px;right:10px;width:min(300px,86vw);max-height:calc(100% - 200px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px;z-index:6;display:none}
  #drawer.open{display:block}
  #drawer h4{font-size:12px;color:var(--mut);font-weight:400;margin:8px 6px 4px}
  .stop{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.2}
  .stop:hover,.stop.cur{background:rgba(255,255,255,.08)}
  .stop i{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:15px;color:var(--mut)}
  .prog{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);z-index:5}
  .prog div{height:100%;width:0;background:var(--acc);transition:width .2s linear}
  /* บนหุ่น: ซ่อนปุ่มบันทึกวิดีโอ (ไม่ให้ไฟล์ไปกองในเครื่องหุ่น) */
  #bRec{display:none}
  @media (max-width:640px){
    .brand b{font-size:12px}.brand span{font-size:10px}
    button{font-size:12px;padding:7px 9px}
  }
</style>
</head>
<body>
<div id="loading">กำลังสร้างฉาก 3 มิติ…</div>
<div id="stage"><canvas id="overlay"></canvas></div>

<div class="bar">
  <div class="brand"><b>วิทยาลัยเทคนิคท่าหลวงซิเมนต์ไทยอนุสรณ์</b><span>Interactive 3D Campus Tour · ลากเพื่อหมุน · หยิก/สกอลล์เพื่อซูม</span></div>
  <div class="ctrls">
    <button class="primary" id="bPlay">▶ เริ่มเล่นวิดีโอทัวร์</button>
    <button id="bPrev" title="ก่อนหน้า">⏮</button>
    <button id="bNext" title="ถัดไป">⏭</button>
    <button id="bSpeed" title="ความเร็ว">1×</button>
    <button class="rec" id="bRec">● บันทึกวิดีโอ</button>
    <button id="bList">☰ สถานที่</button>
  </div>
</div>
<div id="drawer"></div>
<div id="toast"></div>
<div class="prog"><div id="progFill"></div></div>

/* ---------------- helpers ---------------- */
const $ = id=>document.getElementById(id);
const tmpC = new THREE.Color();
function shade(hex,k){tmpC.set(hex);const c=tmpC.clone();return k>0?c.lerp(new THREE.Color('#ffffff'),k):c.lerp(new THREE.Color('#000000'),-k);}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(msg,ms=2600){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms);}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}

/* ---------------- renderer / scene ---------------- */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();

scene.fog=new THREE.Fog(0xd8e9f7,170,420);

camera.position.set(0,80,90);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=1.42;controls.minDistance=6;controls.maxDistance=180;

Object.assign(sun.shadow.camera,{left:-60,right:60,top:45,bottom:-45,near:1,far:200});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.03;

function flat(pts,color,y){const m=new THREE.Mesh(new THREE.ShapeGeometry(polyShape(pts)),M(color));m.rotation.x=-Math.PI/2;m.position.y=y;m.receiveShadow=true;scene.add(m);return m;}

function road(a,b,wd,mat,y){const A=W(...a),B=W(...b);const len=A.distanceTo(B);const m=new THREE.Mesh(new THREE.PlaneGeometry(len,wd),mat);m.rotation.x=-Math.PI/2;m.rotation.z=-Math.atan2(B.z-A.z,B.x-A.x);m.position.set((A.x+B.x)/2,y||0.07,(A.z+B.z)/2);m.receiveShadow=true;scene.add(m);return m;}

/* ---------------- label sprites ---------------- */
const labelSprites=[];
function makeLabel(p){
  const c=document.createElement('canvas');const g=c.getContext('2d');
  g.font=`600 46px ${FONT}`;const tw=g.measureText(p.n).width;

  for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.5,14,16),M('#cfcfcf'));s.position.set(i*3.2,7,0);plant.add(s);}
  const chim=new THREE.Mesh(new THREE.CylinderGeometry(.5,.8,22,12),M('#b8b8b8'));chim.position.set(-4,11,2);plant.add(chim);
  const shed=box(14,5,8,M('#d7d2c8'));shed.position.set(2,0,6);plant.add(shed);
  plant.position.copy(W(-420,60));scene.add(shadowAll(plant));
}
function plantTrees(){
  const blocks=PL.filter(p=>!p.list).map(p=>({c:p.center,r:Math.hypot((p.w||14)*S,(p.d||14)*S)/2+1.2}));
  PL.filter(p=>p.list).forEach(p=>p.list.forEach(q=>blocks.push({c:W(q[0],q[1]),r:2.4})));
  const pts=[];const rnd=mulberry(7);
  const ok=(v,pad)=>{if(Math.abs(v.z-W(0,136).z)<2.6)return false; for(const b of blocks)if(b.c.distanceTo(v)<b.r+(pad||0))return false;return true;};
  // rows along roads & boundary
  for(let x=0;x<813;x+=13){[[x,154],[x,118]].forEach(([a,b])=>{const v=W(a+rnd()*4,b+rnd()*3);if(ok(v))pts.push(v);});}
  const edge=[[8,214],[150,420],[560,388],[813,345]];for(let i=0;i<edge.length-1;i++){const A=edge[i],B=edge[i+1];const n=Math.round(Math.hypot(B[0]-A[0],B[1]-A[1])/12);for(let k=0;k<=n;k++){const v=W(A[0]+(B[0]-A[0])*k/n,A[1]+(B[1]-A[1])*k/n+6);if(ok(v))pts.push(v);}}
  // scatter inside campus gaps
  for(let i=0;i<500;i++){const v=W(20+rnd()*790,160+rnd()*240);if(ok(v,.8)&&rnd()<.55)pts.push(v);}
  // outside forest
  for(let i=0;i<900;i++){const a=rnd()*Math.PI*2,r=60+rnd()*120;const v=new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r*.8);if(ok(v))pts.push(v);}
  const trunkG=new THREE.CylinderGeometry(.1,.14,1,6);trunkG.translate(0,.5,0);
  const leafG=new THREE.IcosahedronGeometry(1,0);
  const trunks=new THREE.InstancedMesh(trunkG,M('#6b4a2b'),pts.length);
  const leaves=new THREE.InstancedMesh(leafG,std({color:'#ffffff',roughness:.9,flatShading:true}),pts.length);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3();const greens=['#3f8f3a','#4fa043','#2f7a35','#5aa84a','#6db352'];
  pts.forEach((v,i)=>{const s=.7+rnd()*.7;sc.set(1,1.2*s,1);m.compose(v,q,sc);trunks.setMatrixAt(i,m);
    q.setFromEuler(new THREE.Euler(rnd(),rnd()*3,0));sc.set(s,s*1.05,s);const pos=v.clone();pos.y=1.2*s+s*.7;m.compose(pos,q,sc);leaves.setMatrixAt(i,m);q.identity();
    leaves.setColorAt(i,new THREE.Color(greens[i%greens.length]));});
  [trunks,leaves].forEach(o=>{o.castShadow=true;o.receiveShadow=true;scene.add(o);});
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------------- tour timeline ---------------- */
const STOPS=[{kind:'open'}].concat(ORDER.map(c=>({kind:'place',p:byCode[c]}))).concat([{kind:'end'}]);
const tour={mode:'free',idx:0,phase:'hold',t:0,from:null,speed:1,elapsed:0};
const HOLD=4.6,FLY=2.5,OPEN=8,END=6;
function poseFor(stop,k){
  if(stop.kind==='open'){const az=-0.9+0.9*k;const dist=100-30*ease(k);const el=.9-.25*ease(k);const tg=new THREE.Vector3(2,0,6);
    return {pos:new THREE.Vector3(tg.x+Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist,tg.z+Math.cos(az)*Math.cos(el)*dist),tgt:tg};}
  if(stop.kind==='end'){const az=.3+.6*k;const dist=75+25*k,el=.7+.15*k;const tg=new THREE.Vector3(2,0,6);
    return {pos:new THREE.Vector3(tg.x+Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist,tg.z+Math.cos(az)*Math.cos(el)*dist),tgt:tg};}
  const p=stop.p;const tg=p.center.clone();tg.y=Math.min(p.top*.45,2.2);
  const dist=clamp(p.span*1.05+8,10,36);const el=p.t==='field'?.62:.42;
  const base=(p.az!==undefined?p.az:-0.25);const az=base+(-0.35+0.7*k);
  return {pos:new THREE.Vector3(tg.x+Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+.5,tg.z+Math.cos(az)*Math.cos(el)*dist),tgt:tg};
}
function holdDur(s){return s.kind==='open'?OPEN:s.kind==='end'?END:HOLD;}
const camTgt=new THREE.Vector3();
function goTo(i,mode){
  tour.idx=clamp(i,0,STOPS.length-1);tour.mode=mode||tour.mode;
  tour.from={pos:camera.position.clone(),tgt:controls.target.clone()};
  tour.phase=(STOPS[tour.idx].kind==='open'&&tour.idx===0&&mode==='tour'&&tour.fresh)?'hold':'fly';tour.fresh=false;tour.t=0;
  controls.enabled=false;highlight();updateList();
}
function startTour(){tour.fresh=true;tour.elapsed=0;goTo(0,'tour');$('bPlay').textContent='⏸ หยุดชั่วคราว';}
function stopTour(){tour.mode='free';controls.enabled=true;controls.target.copy(camTgt);$('bPlay').textContent='▶ เริ่มเล่นวิดีโอทัวร์';highlight();}
function totalDur(){return STOPS.reduce((a,s,i)=>a+holdDur(s)+(i?FLY:0),0);}
function tickTour(dt){
  if(tour.mode==='free')return;
  const st=STOPS[tour.idx];tour.t+=dt*tour.speed;if(tour.mode==='tour')tour.elapsed+=dt*tour.speed;
  let pose;
  if(tour.phase==='fly'){
    const k=clamp(tour.t/FLY,0,1),e=ease(k);const to=poseFor(st,0);
    pose={pos:tour.from.pos.clone().lerp(to.pos,e),tgt:tour.from.tgt.clone().lerp(to.tgt,e)};
    pose.pos.y+=Math.sin(Math.PI*e)*Math.min(14,tour.from.pos.distanceTo(to.pos)*.25);
    if(k>=1){tour.phase='hold';tour.t=0;}
  } else {
    const hd=holdDur(st);const k=tour.mode==='single'?((tour.t/hd)%2<1?(tour.t/hd)%1:1-(tour.t/hd)%1):clamp(tour.t/hd,0,1);
    pose=poseFor(st,st.kind==='place'?k:clamp(tour.t/hd,0,1));
    if(tour.mode==='tour'&&tour.t>=hd){
      if(tour.idx<STOPS.length-1)goTo(tour.idx+1,'tour');
      else{stopTour();if(rec.active)stopRec();toast('จบการนำชมแล้ว ขอบคุณที่ร่วมชม');}
    }
  }
  camera.position.copy(pose.pos);camTgt.copy(pose.tgt);camera.lookAt(camTgt);
}
function highlight(){
  const cur=tour.mode!=='free'?STOPS[tour.idx]:null;
  PL.forEach(p=>{const on=cur&&cur.p===p;const sp=p.label;const b=sp.userData.base;const s=on?1.7:1;sp.scale.set(b.x*s,b.y*s,1);
    sp.material.opacity=!cur||on?1:cur.kind==='end'?.85:.0;sp.visible=sp.material.opacity>0;});
}

/* ---------------- overlay: lower third + titles (drawn on canvas so it's in the recording) ---------------- */
const ov=$('overlay');const og=ov.getContext('2d');
function wrapTokens(ctx,tokens,maxW){const lines=[];let cur='';tokens.forEach((t,i)=>{const s=cur?cur+'  •  '+t:t;if(ctx.measureText(s).width>maxW&&cur){lines.push(cur);cur=t;}else cur=s;});if(cur)lines.push(cur);return lines;}
function drawOverlay(){
  const w=ov.width,h=ov.height;og.clearRect(0,0,w,h);
  const u=Math.min(w,h*1.6)/1000; // unit
  // vignette subtle
  const st=tour.mode!=='free'?STOPS[tour.idx]:null;
  if(st&&st.kind==='open'){
    const a=tour.phase==='hold'?clamp(tour.t*tour.speed/1.2,0,1)*clamp((OPEN-tour.t)/1.2,0,1):0;
    if(a>0){og.save();og.globalAlpha=a;og.textAlign='center';
      og.fillStyle='rgba(8,16,30,.45)';const bh=170*u;og.fillRect(0,h*.36,w,bh);
      og.fillStyle='#ffb020';og.font=`600 ${22*u}px ${FONT}`;og.fillText('CAMPUS TOUR 3D',w/2,h*.36+40*u);
      og.fillStyle='#fff';og.font=`700 ${44*u}px ${FONT}`;og.fillText('วิทยาลัยเทคนิคท่าหลวงซิเมนต์ไทยอนุสรณ์',w/2,h*.36+95*u);
      og.font=`300 ${20*u}px ${FONT}`;og.fillStyle='#dfe8f4';og.fillText('Tha Luang Cement Thai Anusorn Technical College · ถนนพัฒนพงศ์',w/2,h*.36+135*u);og.restore();}
  }
  if(st&&st.kind==='end'&&tour.phase==='hold'){
    const a=clamp(tour.t/1.2,0,1);og.save();og.globalAlpha=a;og.textAlign='center';og.fillStyle='rgba(8,16,30,.45)';og.fillRect(0,h*.4,w,120*u);
    og.fillStyle='#fff';og.font=`700 ${40*u}px ${FONT}`;og.fillText('ขอบคุณที่ร่วมชม',w/2,h*.4+60*u);og.font=`300 ${20*u}px ${FONT}`;og.fillStyle='#dfe8f4';og.fillText('วิทยาลัยเทคนิคท่าหลวงซิเมนต์ไทยอนุสรณ์',w/2,h*.4+98*u);og.restore();
  }
  if(st&&st.kind==='place'&&tour.phase==='hold'){
    const p=st.p;const hd=holdDur(st);
    const tin=clamp(tour.t/0.6,0,1),tout=tour.mode==='tour'?clamp((hd-tour.t)/0.45,0,1):1;const e=ease(tin)*tout;
    const pad=24*u,x0=pad-(1-ease(tin))*300*u;const bw=Math.min(w-2*pad,820*u);
    og.save();og.globalAlpha=tout;
    og.font=`300 ${19*u}px ${FONT}`;const lines=wrapTokens(og,p.u,bw-150*u).slice(0,3);
    const bh=(78+lines.length*27)*u;const y0=h-bh-pad-10*u;
    // badge
    og.fillStyle=p.col;rrect(og,x0,y0,108*u,bh,14*u);og.fill();
    og.fillStyle='rgba(0,0,0,.12)';rrect(og,x0,y0+bh-8*u,108*u,8*u,4*u);og.fill();
    const light=tmpC.set(p.col).getHSL({}).l>0.7;og.fillStyle=light?'#1b2433':'#fff';og.textAlign='center';og.textBaseline='middle';
    og.font=`700 ${(p.c.length>1?40:56)*u}px ${FONT}`;og.fillText(p.c,x0+54*u,y0+bh/2);
    // main bar
    const bx=x0+116*u;const barW=(bw-116*u)*e;
    if(barW>4){og.save();rrect(og,bx,y0,barW,bh,14*u);og.clip();
      const gr=og.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,'rgba(10,20,36,.92)');gr.addColorStop(1,'rgba(10,20,36,.72)');og.fillStyle=gr;og.fillRect(bx,y0,bw,bh);
      og.fillStyle=p.col;og.fillRect(bx,y0,5*u,bh);
      og.textAlign='left';og.textBaseline='alphabetic';
      og.fillStyle='#ffb020';og.font=`600 ${14*u}px ${FONT}`;const n=STOPS.indexOf(st);og.fillText(`จุดที่ ${String(n).padStart(2,'0')} / ${ORDER.length}   ·   ${typeName(p)}`,bx+22*u,y0+26*u);
      og.fillStyle='#fff';og.font=`600 ${30*u}px ${FONT}`;og.fillText(p.n,bx+22*u,y0+62*u);
      og.fillStyle='#d5deea';og.font=`300 ${19*u}px ${FONT}`;lines.forEach((l,i)=>og.fillText(l,bx+22*u,y0+(92+i*27)*u));
      og.restore();}
    og.restore();
  }
  // watermark + REC
  og.save();og.textAlign='right';og.textBaseline='alphabetic';og.fillStyle='rgba(255,255,255,.75)';og.font=`600 ${13*u}px ${FONT}`;
  if(rec.active){og.fillStyle='#ff3b3b';og.beginPath();og.arc(w-150*u,h-22*u,6*u,0,7);og.fill();og.fillStyle='#fff';og.fillText('REC '+fmt(rec.sec()),w-pad(u),h-17*u);}
  og.restore();
}
function pad(u){return 24*u}
function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function typeName(p){if(/^[1-9]$/.test(p.c))return 'อาคารเรียนและปฏิบัติการ';if('ABCD'.includes(p.c))return 'บ้านพักและสวัสดิการ';if('EFGHIJK⚽'.includes(p.c))return 'สนามกีฬาและจุดสำคัญหน้าวิทยาลัย';return 'ศูนย์บริการและโรงฝึกงาน';}

/* ---------------- recording ---------------- */
const rec={active:false,mr:null,chunks:[],start:0,canvas:null,ctx:null,mime:'',ext:'webm',sec(){return (performance.now()-this.start)/1000;}};
let downloads=null;
if(window.claude&&claude.use)claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});
function pickMime(){const c=[['video/mp4;codecs=avc1.42E01E','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9','webm'],['video/webm;codecs=vp8','webm'],['video/webm','webm']];
  for(const [m,e] of c){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return [m,e];}return ['', 'webm'];}
function startRec(){
  if(!window.MediaRecorder){toast('เบราว์เซอร์นี้ไม่รองรับการบันทึกวิดีโอ');return;}
  const src=renderer.domElement;rec.canvas=document.createElement('canvas');rec.canvas.width=src.width&~1;rec.canvas.height=src.height&~1;rec.ctx=rec.canvas.getContext('2d');
  const [m,e]=pickMime();rec.mime=m;rec.ext=e;
  const stream=rec.canvas.captureStream(30);
  try{rec.mr=new MediaRecorder(stream,m?{mimeType:m,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});}catch(err){toast('เริ่มบันทึกไม่ได้: '+err.message);return;}
  rec.chunks=[];rec.mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)rec.chunks.push(ev.data);};
  rec.mr.onstop=saveRec;rec.mr.start(500);rec.active=true;rec.start=performance.now();
  $('bRec').classList.add('on');$('bRec').textContent='■ หยุดบันทึก';
  if(tour.mode!=='tour'){startTour();toast('เริ่มบันทึก + เล่นทัวร์ตั้งแต่ต้น (จะหยุดเองเมื่อจบ)');}
}
function stopRec(){if(!rec.active)return;rec.active=false;rec.mr.stop();$('bRec').classList.remove('on');$('bRec').textContent='● บันทึกวิดีโอ';}
async function saveRec(){
  const blob=new Blob(rec.chunks,{type:rec.mime||'video/webm'});const name=`TLCT-Campus-Tour.${rec.ext}`;
  if(downloads){try{await downloads.save({filename:name,data:blob});toast('บันทึกไฟล์ '+name+' แล้ว');return;}catch(e){if(e&&e.code==='declined'){toast('ยกเลิกการดาวน์โหลด');return;}}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('กำลังดาวน์โหลด '+name);}
  catch(e){toast('ดาวน์โหลดไม่สำเร็จในหน้าต่างนี้');}
}
function captureFrame(){if(!rec.active)return;const c=rec.ctx,W2=rec.canvas.width,H=rec.canvas.height;c.drawImage(renderer.domElement,0,0,W2,H);c.drawImage(ov,0,0,W2,H);}

/* ---------------- UI ---------------- */
function buildList(){
  const d=$('drawer');let html='';let grp='';
  ORDER.forEach((c,i)=>{const p=byCode[c];const g=typeName(p);if(g!==grp){html+=`<h4>${g}</h4>`;grp=g;}
    html+=`<div class="stop" data-i="${i+1}"><i style="background:${p.col};color:${tmpC.set(p.col).getHSL({}).l>.7?'#1b2433':'#fff'}">${c}</i><span>${p.n}</span></div>`;});
  d.innerHTML=html;
  d.querySelectorAll('.stop').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(tour.mode==='tour'){goTo(i,'tour');}else goTo(i,'single');sayName(STOPS[i].p);if(innerWidth<700)d.classList.remove('open');});
}
function updateList(){document.querySelectorAll('.stop').forEach(el=>el.classList.toggle('cur',tour.mode!=='free'&&+el.dataset.i===tour.idx));}
$('bPlay').onclick=()=>{if(tour.mode==='tour'){stopTour();if(rec.active)stopRec();}else startTour();};
$('bNext').onclick=()=>goTo(Math.min(tour.idx+1,STOPS.length-1),tour.mode==='tour'?'tour':'single');
$('bPrev').onclick=()=>goTo(Math.max(tour.idx-1,0),tour.mode==='tour'?'tour':'single');
const SPEEDS=[1,1.5,2,0.75];$('bSpeed').onclick=()=>{tour.speed=SPEEDS[(SPEEDS.indexOf(tour.speed)+1)%SPEEDS.length];$('bSpeed').textContent=tour.speed+'×';};
$('bRec').onclick=()=>rec.active?stopRec():startRec();
$('bList').onclick=()=>$('drawer').classList.toggle('open');
renderer.domElement.addEventListener('pointerdown',()=>{if(tour.mode==='single')stopTour();});
renderer.domElement.addEventListener('wheel',()=>{if(tour.mode==='single')stopTour();},{passive:true});

/* ---------------- แตะป้ายชื่อ → หุ่นพูดชื่อสถานที่ ----------------
   เปิดในหน้าหุ่น (iframe) ใช้เสียงเดียวกับหุ่น (parent.speak) / เปิดหน้านี้เดี่ยว ๆ ใช้เสียงในเครื่อง
   แยกแตะออกจากลากหมุน: กดแล้วปล่อยเร็ว ๆ ไม่ขยับเกิน 8px ถึงนับว่าแตะ */
function sayName(p){
  if(!p)return;const text=p.n;
  try{if(window.parent!==window&&typeof window.parent.speak==='function'){window.parent.speak(text,'th');return;}}catch(e){}
  if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';speechSynthesis.speak(u);}
}
const picker=new THREE.Raycaster(),pickPt=new THREE.Vector2();let downAt=null;
function pickLabel(ev){
  const r=renderer.domElement.getBoundingClientRect();
  pickPt.set((ev.clientX-r.left)/r.width*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  picker.setFromCamera(pickPt,camera);
  const hit=picker.intersectObjects(PL.map(p=>p.label).filter(s=>s&&s.visible),false)[0];
  return hit?PL.find(p=>p.label===hit.object):null;
}
renderer.domElement.addEventListener('pointerdown',ev=>{downAt={x:ev.clientX,y:ev.clientY,t:performance.now()};});
renderer.domElement.addEventListener('pointerup',ev=>{
  const d=downAt;downAt=null;
  if(!d||Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>8||performance.now()-d.t>600)return;
  const p=pickLabel(ev);if(!p)return;
  sayName(p);
  const sp=p.label,b=sp.userData.base;sp.scale.set(b.x*1.4,b.y*1.4,1);setTimeout(highlight,350);   // ป้ายเด้งให้รู้ว่าแตะโดน
});

/* ---------------- loop ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?58:42;camera.updateProjectionMatrix();
  const pr=renderer.getPixelRatio();ov.width=Math.round(w*pr);ov.height=Math.round(h*pr);}
addEventListener('resize',resize);
let last=performance.now();const clock={t:0};
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;clock.t+=dt;
  tickTour(dt);
  if(tour.mode==='free'){controls.update();camTgt.copy(controls.target);}
  const flag=byCode['I'].obj.userData.flag;if(flag){const pa=flag.geometry.attributes.position;for(let i=0;i<pa.count;i++){const x=pa.getX(i);pa.setZ(i,Math.sin(x*3-clock.t*5)*.12*x);}pa.needsUpdate=true;}
  renderer.render(scene,camera);drawOverlay();captureFrame();
  if(tour.mode==='tour'){$('progFill').style.width=(100*tour.elapsed/totalDur()).toFixed(2)+'%';}else $('progFill').style.width='0';
  requestAnimationFrame(frame);
}
function init(){
  buildAll();buildList();resize();
  const p0=poseFor(STOPS[0],0);camera.position.copy(p0.pos);controls.target.copy(p0.tgt);camTgt.copy(p0.tgt);controls.update();
  $('loading').remove();requestAnimationFrame(frame);
  setTimeout(()=>toast('กด “▶ เริ่มเล่นวิดีโอทัวร์” เพื่อชมแบบอัตโนมัติ หรือแตะ “☰ สถานที่” เพื่อเลือกจุด',4200),600);
}
const fontReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load(`600 40px Kanit`),document.fonts.load(`700 40px Kanit`),document.fonts.load(`300 20px Kanit`)]):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,2500))]).then(init,init);
})();
</script>
